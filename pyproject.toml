[project]
name = "invoice-extractor"
version = "1.0.0"
description = "LLM-based invoice extraction pipeline with validation, review flagging, an eval harness and a web UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "rapidfuzz>=3.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
invoice-extract = "invoice_extractor.cli:extract_app"
invoice-eval = "invoice_extractor.cli:eval_app"
invoice-serve = "invoice_extractor.cli:serve_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_extractor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
